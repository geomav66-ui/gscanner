<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode URL Scanner</title>
    <!-- Εισαγωγή της επίσημης βιβλιοθήκης ZXing -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 450px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        #result { margin-top: 25px; font-size: 1.2em; font-weight: bold; color: #2c3e50; min-height: 50px; }
        .upload-btn { background-color: #2ecc71; color: white; padding: 18px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.3em; font-weight: bold; width: 100%; box-shadow: 0 4px 6px rgba(46, 204, 113, 0.3); }
        .upload-btn:active { background-color: #27ae60; }
        .preview-img { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 4px; display: none; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Barcode to URL Scanner</h1>
        <p>Βγάλτε μια φωτογραφία το barcode ή ανεβάστε μια έτοιμη εικόνα</p>
        
        <!-- Input για λήψη φωτογραφίας ή επιλογή αρχείου -->
        <input type="file" id="barcode-file" accept="image/*" capture="environment" style="display:none;">
        
        <button onclick="document.getElementById('barcode-file').click()" class="upload-btn">
            📸 Φωτογράφιση Barcode
        </button>

        <!-- Στοιχείο εικόνας που θα διαβάσει απευθείας η ZXing -->
        <img id="image-preview" class="preview-img" alt="Προεπισκόπηση">
        
        <div id="result">Φόρτωση λίστας...</div>
    </div>

    <script>
        // === ΚΑΝΕ PASTE ΤΑ ΔΕΔΟΜΕΝΑ ΣΟΥ ΑΠΟ ΤΟ EXCEL ΕΔΩ ===
        const rawExcelText = `
5200100670294	https://www.efthymiadis.gr/inst/redestos/gallery///KaisoSorbie_500gr_EYTH_1025.pdf
5200252690010	https://www.efthymiadis.gr/inst/redestos/gallery///KaisoSorbie_500gr_EYTH_1025.pdf
        `;
        // ===============================================

        let barcodeMap = {};

        // Ανάγνωση δεδομένων Excel
        const lines = rawExcelText.split('\n');
        for (let i = 0; i < lines.length; i++) {
            const currentLine = lines[i].trim();
            if (!currentLine) continue;
            const columns = currentLine.split('\t');
            if (columns.length >= 2) {
                const code = columns.trim();
                let url = columns.trim();
                if (code && url && !code.toLowerCase().includes('barcode')) {
                    if (url.toLowerCase().startsWith('www.')) url = 'https://' + url;
                    barcodeMap[code] = url;
                }
            }
        }

        // Έλεγχος αν φορτώθηκε η λίστα
        const totalCount = Object.keys(barcodeMap).length;
        if (totalCount > 0) {
            document.getElementById('result').style.color = "green";
            document.getElementById('result').innerText = `Έτοιμο! Φορτώθηκαν ${totalCount} barcodes.`;
            setupImageReader();
        } else {
            document.getElementById('result').style.color = "red";
            document.getElementById('result').innerHTML = "Δεν βρέθηκαν δεδομένα στο Excel!";
        }

        function setupImageReader() {
            const fileInput = document.getElementById('barcode-file');
            const previewImg = document.getElementById('image-preview');
            const resultDiv = document.getElementById('result');
            
            // Αρχικοποίηση του επίσημου MultiFormat Reader για Browser
            const hints = new Map();
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true); // Εντατική αναζήτηση γραμμών
            const codeReader = new ZXing.BrowserMultiFormatReader(hints);

            fileInput.addEventListener('change', e => {
                if (e.target.files.length == 0) return;
                
                resultDiv.style.color = "#2c3e50";
                resultDiv.innerText = "🔍 Ανάλυση φωτογραφίας...";
                
                const file = e.target.files[0];
                const readerURL = new FileReader();
                
                readerURL.onload = function(event) {
                    // Εμφάνιση της εικόνας στην οθόνη
                    previewImg.src = event.target.result;
                    previewImg.style.display = "inline-block";
                    
                    // Μόλις η εικόνα φορτώσει πλήρως στο <img> tag, τη στέλνουμε στη ZXing
                    previewImg.onload = function() {
                        codeReader.decodeFromImage(previewImg)
                            .then(result => {
                                const cleanBarcode = result.text.trim();
                                resultDiv.innerText = `Barcode: ${cleanBarcode}`;
                                
                                if (barcodeMap[cleanBarcode]) {
                                    resultDiv.innerHTML += "<br><span style='color:green;'>Βρέθηκε! Ανακατεύθυνση...</span>";
                                    window.location.href = barcodeMap[cleanBarcode];
                                } else {
                                    resultDiv.innerHTML += "<br><span style='color:red;'>Δεν υπάρχει στη λίστα Excel!</span>";
                                }
                            })
                            .catch(err => {
                                resultDiv.style.color = "red";
                                resultDiv.innerText = "Δεν βρέθηκε καθαρό Barcode. Βεβαιωθείτε ότι η φωτογραφία είναι κοντινή, οριζόντια και εστιασμένη (όχι θολή).";
                                console.error(err);
                            });
                    };
                };
                readerURL.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
