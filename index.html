        let barcodeMap = {};
        let html5QrCode = null;
        let isTorchOn = false;

        // Ανάγνωση δεδομένων Excel
        const lines = rawExcelText.split('\n');
        for (let i = 0; i < lines.length; i++) {
            const currentLine = lines[i].trim();
            if (!currentLine) continue;
            const columns = currentLine.split('\t');
            if (columns.length >= 2) {
                const code = columns[0].trim();
                let url = columns[1].trim();
                if (code && url && !code.toLowerCase().includes('barcode')) {
                    if (url.toLowerCase().startsWith('www.')) url = 'https://' + url;
                    barcodeMap[code] = url;
                }
            }
        }

        const totalCount = Object.keys(barcodeMap).length;
        if (totalCount > 0) {
            document.getElementById('result').style.color = "green";
            document.getElementById('result').innerText = `Επιτυχία! Φορτώθηκαν ${totalCount} barcodes.`;
        } else {
            document.getElementById('result').style.color = "red";
            document.getElementById('result').innerHTML = "Δεν βρέθηκαν δεδομένα!";
        }

        function startScanner() {
            document.getElementById('start-btn').style.display = "none";
            document.getElementById('reader').style.display = "block";
            document.getElementById('result').style.color = "#2c3e50";
            document.getElementById('result').innerText = "Προετοιμασία κάμερας...";

            html5QrCode = new Html5Qrcode("reader");
            
            const config = { 
                fps: 20, // Περισσότερα frames για γρήγορη απόκριση
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    // Σχετικά μικρότερο κουτί εστίασης για να αναγκάζει το χρήστη να κεντράρει με ακρίβεια
                    const size = Math.min(viewfinderWidth * 0.75, 250);
                    return { width: size, height: Math.floor(size * 0.5) };
                },
                aspectRatio: 1.777778,
                experimentalFeatures: { useBarCodeDetectorIfSupported: false }
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess,
                (errorMessage) => { /* Παράκαμψη λαθών */ }
            )
            .then(() => {
                document.getElementById('result').style.color = "green";
                document.getElementById('result').innerText = "Η κάμερα είναι ζωντανή! Χρησιμοποιήστε το Zoom για μικρά barcodes.";
                document.getElementById('controls').style.display = "block";
                
                setupAdvancedFeatures();
            })
            .catch(err => {
                document.getElementById('result').style.color = "red";
                document.getElementById('result').innerHTML = "Σφάλμα: " + err;
            });
        }

        function setupAdvancedFeatures() {
            try {
                const track = html5QrCode.getRunningTrack();
                const capabilities = track.getCapabilities();
                
                // Ενεργοποίηση συνεχούς εστίασης
                if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                    track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
                }

                // Ρύθμιση του Zoom αν υποστηρίζεται από το κινητό
                if (capabilities.zoom) {
                    const zoomRow = document.getElementById('zoom-row');
                    const zoomRange = document.getElementById('zoom-range');
                    
                    zoomRange.min = capabilities.zoom.min;
                    zoomRange.max = capabilities.zoom.max;
                    zoomRange.step = capabilities.zoom.step || 0.1;
                    zoomRange.value = capabilities.zoom.min;
                    
                    zoomRow.style.display = "flex";
                    
                    zoomRange.addEventListener('input', (e) => {
                        track.applyConstraints({
                            advanced: [{ zoom: parseFloat(e.target.value) }]
                        });
                    });
                }
            } catch (e) {
                console.log("Προηγμένες λειτουργίες κάμερας μη διαθέσιμες σε αυτή τη συσκευή.", e);
            }
        }

        function toggleTorch() {
            try {
                const track = html5QrCode.getRunningTrack();
                const capabilities = track.getCapabilities();
                
                if (capabilities.torch) {
                    isTorchOn = !isTorchOn;
                    track.applyConstraints({
                        advanced: [{ torch: isTorchOn }]
                    }).then(() => {
                        document.getElementById('torch-btn').innerText = isTorchOn ? "❌ Σβήσιμο Φακού" : "💡 Άναμμα Φακού";
                    });
                } else {
                    alert("Ο φακός δεν υποστηρίζεται ή δεν είναι διαθέσιμος στον browser της συσκευής σας.");
                }
            } catch (e) {
                alert("Αδυναμία ελέγχου του φακού.");
            }
        }

        function onScanSuccess(decodedText) {
            const cleanBarcode = decodedText.trim();
            document.getElementById('result').style.color = "#2c3e50";
            document.getElementById('result').innerText = `Barcode: ${cleanBarcode}`;
            
            if (barcodeMap[cleanBarcode]) {
                document.getElementById('result').innerHTML += "<br><span style='color:green;'>Βρέθηκε! Ανακατεύθυνση...</span>";
                window.location.href = barcodeMap[cleanBarcode];
            } else {
                document.getElementById('result').innerHTML += "<br><span style='color:red;'>Δεν υπάρχει στη λίστα!</span>";
            }
        }
