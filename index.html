<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode URL Scanner</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f4f9; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border: 2px solid #333; border-radius: 8px; background: white; min-height: 250px; display: none; }
        #result { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #2c3e50; }
        .btn { background-color: #2ecc71; color: white; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 5px; cursor: pointer; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Barcode to URL Scanner</h1>
    <p>Κεντράρετε το μακρόστενο barcode οριζόντια στο στενό πλαίσιο</p>
    
    <button id="start-btn" class="btn" onclick="startScanner()">Εκκίνηση Κάμερας</button>

    <div id="reader"></div>
    <div id="result">Φόρτωση λίστας...</div>

    <script>
        // === ΚΑΝΕ PASTE ΤΑ ΔΕΔΟΜΕΝΑ ΣΟΥ ΑΠΟ ΤΟ EXCEL ΕΔΩ ===
        const rawExcelText = `
5200100670294	https://www.efthymiadis.gr/inst/redestos/gallery///KaisoSorbie_500gr_EYTH_1025.pdf
5200252690010	https://www.efthymiadis.gr/inst/redestos/gallery///KaisoSorbie_500gr_EYTH_1025.pdf
`;

        let barcodeMap = {};
        let html5QrCode = null;

        // Ανάγνωση δεδομένων
        const lines = rawExcelText.split('\n');
        for (let i = 0; i < lines.length; i++) {
            const currentLine = lines[i].trim();
            if (!currentLine) continue;

            const columns = currentLine.split('\t');
            if (columns.length >= 2) {
                const code = columns[0].trim();
                let url = columns[1].trim();
                
                if (code && url && !code.toLowerCase().includes('barcode')) {
                    if (url.toLowerCase().startsWith('www.')) {
                        url = 'https://' + url;
                    }
                    barcodeMap[code] = url;
                }
            }
        }

        const totalCount = Object.keys(barcodeMap).length;
        if (totalCount > 0) {
            document.getElementById('result').style.color = "green";
            document.getElementById('result').innerText = `Επιτυχία! Φορτώθηκαν ${totalCount} barcodes.`;
        } else {
            document.getElementById('result').style.color = "red";
            document.getElementById('result').innerHTML = "Δεν βρέθηκαν δεδομένα στο Excel!";
        }

        function startScanner() {
            document.getElementById('start-btn').style.display = "none";
            document.getElementById('reader').style.display = "block";
            document.getElementById('result').style.color = "#2c3e50";
            document.getElementById('result').innerText = "Προετοιμασία κάμερας υψηλής ανάλυσης...";

            html5QrCode = new Html5Qrcode("reader");
            
            const config = { 
                fps: 20, // Περισσότερα frames ανά δευτερόλεπτο για ταχύτερη ανίχνευση
                // Εξαιρετικά στενό κουτί (12% του ύψους), ιδανικό για απομόνωση μικρών γραμμικών barcodes
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    const width = Math.floor(viewfinderWidth * 0.85); 
                    const height = Math.floor(viewfinderHeight * 0.12); 
                    return { width: width, height: height };
                },
                aspectRatio: 1.777778, // Αναγκαστικό 16:9 για αποφυγή παραμόρφωσης των pixel
                experimentalFeatures: { useBarCodeDetectorIfSupported: false }
            };

            // ΕΞΑΝΑΓΚΑΣΜΟΣ ΥΨΗΛΗΣ ΑΝΑΛΥΣΗΣ (Full HD 1080p)
            const videoConstraints = {
                facingMode: "environment",
                width: { min: 1280, ideal: 1920, max: 2560 },
                height: { min: 720, ideal: 1080, max: 1440 }
            };

            html5QrCode.start(
                videoConstraints, 
                config, 
                onScanSuccess,
                (errorMessage) => { /* Παράκαμψη λαθών εστίασης */ }
            )
            .then(() => {
                document.getElementById('result').style.color = "green";
                document.getElementById('result').innerText = "Η HD κάμερα λειτουργεί! Κρατήστε το κινητό στα 25-30 εκατοστά μακριά.";
                
                // Προσπάθεια ενεργοποίησης συνεχούς εστίασης (Focus)
                try {
                    const track = html5QrCode.getRunningTrack();
                    if (track && typeof track.applyConstraints === 'function') {
                        track.applyConstraints({
                            advanced: [{ focusMode: "continuous" }]
                        }).catch(e => console.log(e));
                    }
                } catch(e) {}
            })
            .catch(err => {
                document.getElementById('result').style.color = "red";
                document.getElementById('result').innerHTML = "Σφάλμα κάμερας: " + err;
            });
        }

        function onScanSuccess(decodedText) {
            const cleanBarcode = decodedText.trim();
            document.getElementById('result').style.color = "#2c3e50";
            document.getElementById('result').innerText = `Barcode: ${cleanBarcode}`;
            
            if (barcodeMap[cleanBarcode]) {
                document.getElementById('result').innerHTML += "<br><span style='color:green;'>Βρέθηκε! Ανακατεύθυνση...</span>";
                
                html5QrCode.stop().then(() => {
                    window.location.href = barcodeMap[cleanBarcode];
                }).catch(() => {
                    window.location.href = barcodeMap[cleanBarcode];
                });
            } else {
                document.getElementById('result').innerHTML += "<br><span style='color:red;'>Δεν υπάρχει στη λίστα!</span>";
            }
        }
    </script>
</body>
</html>
